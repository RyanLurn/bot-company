pre-commit:
  jobs:
    - name: format changed files
      run: pnpm exec prettier {staged_files} --write --ignore-unknown --no-error-on-unmatched-pattern
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: check types
      run: pnpm run check-types

    - name: lint
      run: pnpm run lint

    - name: check format
      run: pnpm run format:check
